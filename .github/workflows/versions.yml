# SPL Pocket uygulamasının okuduğu versions.json dosyasını 6 saatte bir yeniler.
# Yalnızca içerik değiştiğinde commit atar.
name: versions.json

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: versions-json
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build versions.json
        env:
          # Yalnızca api.github.com isteklerinde kullanılır (kimliksiz istekler runner'da 403 alıyor).
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/build_versions.py versions.json

      - name: Commit if changed
        run: |
          if git diff --quiet -- versions.json; then
            echo "versions.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions.json
          git commit -m "Update versions.json"
          git push
